<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_desc }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_desc }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F766E'/%3E%3Cpath d='M9 10l6 6-6 6M17 22h7' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  {% if extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename=extra_css) }}">{% endif %}
  <script defer src="{{ url_for('static', filename='js/site.js') }}"></script>
  {% set stats_cfg = data.get("analytics") %}
  {% if stats_cfg and stats_cfg.script_src and stats_cfg.domain %}
  <script defer data-domain="{{ stats_cfg.domain }}" src="{{ stats_cfg.script_src }}"></script>
  {% endif %}
</head>
