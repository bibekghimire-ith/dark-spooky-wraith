<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_desc }}">
  <meta name="theme-color" content="#E5E5E5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/retro.css') }}">
  {% if extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename=extra_css) }}">{% endif %}
  {% set stats = data.get("analytics") %}
  {% if stats and stats.script_src and stats.domain %}
  <script defer data-domain="{{ stats.domain }}" src="{{ stats.script_src }}"></script>
  {% endif %}
</head>
